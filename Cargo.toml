
[package]
name = "voip-ms"
description = "Async client for the VoIP.ms REST API"
version = "0.13.0"
repository = "https://github.com/ecliptical/voip-ms"
authors = ["Peter Nehrer <pnehrer@eclipticalsoftware.com>"]
license = "MIT"
keywords = ["voip", "voipms", "telephony", "sms", "async"]
categories = ["api-bindings", "asynchronous"]
edition = "2024"
rust-version = "1.88"

[workspace]
members = [".", "livetest", "xtask"]

[features]
default = ["rustls-tls-native-roots"]

# TLS backend selection -- pick one that matches your deployment.
# `rustls-tls-native-roots` (default): rustls verifying against the OS trust store.
# `native-tls`: use the platform's native TLS stack.
rustls-tls-native-roots = ["reqwest/rustls"]
native-tls = ["reqwest/native-tls"]

# Exposes `Client::call_raw_unchecked` and `call_multipart_raw_unchecked` --
# return the raw envelope without classifying its status, for diagnosing
# unexpected error statuses. Off by default; the live-API harness enables it.
unchecked-raw = []

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart", "query"] }
rust_decimal = "1.43"
# The wire renderings in `src/form.rs`. A parameter's wire form is a contract,
# and `Display` is a presentation trait, so neither is rendered through it --
# these two are the encoders `serde_urlencoded` and `serde_json` use for the
# same job.
itoa = "1.0"
ryu = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"

[dev-dependencies]
# The encoder `reqwest`'s `.query()` uses. Held here so `src/form.rs`'s
# rendering is asserted against it value by value rather than by eye.
serde_urlencoded = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
wiremock = "0.6"

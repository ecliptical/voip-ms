on:
  pull_request:
  push:
    branches:
      - main

name: Rust CI

jobs:
  lint:
    name: Check formatting and run clippy
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source code
        uses: actions/checkout@v7
      - name: Cache tools
        uses: actions/cache@v6
        with:
          key: ${{ runner.os }}-${{ hashFiles('Cargo.toml') }}
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        # Same selection as the test job, so everything that runs is linted.
        run: cargo clippy --workspace --all-targets --features unchecked-raw -- -D warnings
      - name: Check the non-default TLS backend
        # `native-tls` ships but is not the default, so nothing else builds it.
        # It cannot go in the test job: enabled alongside the default rustls,
        # reqwest picks native-tls, so the tests would exercise a stack the
        # crate does not ship, and it drags OpenSSL in.
        run: cargo check --no-default-features --features native-tls
      - name: Audit the generated surface
        # Both read the committed inputs and `src/generated.rs`, so they hold
        # without an API call. `--deny` is what makes "the surface reports
        # nothing" a rule rather than a note in AGENTS.md: a field typed one
        # way to read and another to write, or a documented flag left an
        # integer, fails here instead of reaching a release.
        run: |
          cargo xtask check-types --deny
          cargo xtask check-flags --deny
      - name: Build the docs strictly
        # A doc comment on a `pub` item is rendered output, and `build` and
        # `clippy` never run rustdoc -- so a broken intra-doc link or an
        # angle-bracket placeholder read as an HTML tag ships green and shows up
        # only in the rendered docs. `--workspace` covers `xtask` and `livetest`
        # too: neither is published, but both are read, and neither can link to
        # the types in `voip-ms` (they do not depend on it), which is the
        # mistake this catches.
        run: RUSTDOCFLAGS="-D warnings -D rustdoc::broken_intra_doc_links" cargo doc --no-deps --workspace
      - name: Check the generated surface is what the generator emits
        # `src/generated.rs` is committed, so an edit to `xtask` reaches a
        # release only if someone re-ran `gen`. Regenerating here and demanding
        # a clean tree makes the two move together: a hand-edit to the
        # `@generated` file, or a generator change committed without its
        # output, fails instead of shipping.
        run: |
          cargo xtask gen
          git diff --exit-code -- src/generated.rs livetest/src/response_fields.rs

  coverage:
    name: Run tests with coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source code
        uses: actions/checkout@v7
      - name: Cache tools
        uses: actions/cache@v6
        with:
          key: ${{ runner.os }}-${{ hashFiles('Cargo.toml') }}
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools
      - name: Run unit tests
        # --workspace: the root package is also the workspace root, so a bare
        # `cargo test` selects it alone and skips livetest's and xtask's tests.
        # `unchecked-raw` is named for the reader rather than out of necessity
        # -- livetest already requires it, so any --workspace build unifies it
        # on -- and --all-features is deliberately not used, since it would
        # switch the TLS backend to native-tls.
        #
        # This also widens what the coverage report below measures: livetest is
        # an operator harness whose paths only execute against the live API, so
        # it enters the denominator largely uncovered.
        run: cargo test --workspace --features unchecked-raw
        env:
          RUSTFLAGS: '-Cinstrument-coverage'
          LLVM_PROFILE_FILE: 'target/coverage/%p-%m.profraw'
      - name: Generate coverage report
        uses: ecliptical/covdir-report-action@v0.4
        with:
          summary: 'true'
          out: ./target/coverage.md
      - name: Add coverage comment to the pull request
        uses: marocchino/sticky-pull-request-comment@v3
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        with:
          hide_and_recreate: true
          hide_classify: "OUTDATED"
          path: ./target/coverage.md
